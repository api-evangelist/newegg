name: Newegg
description: >-
  Newegg is a leading global online retailer of computer hardware, consumer
  electronics, and technology products, operating the Newegg.com (US),
  NeweggBusiness.com (B2B), and Newegg.ca (Canada) marketplaces. For third-party
  sellers Newegg exposes the Newegg Marketplace API, an API-key-authenticated,
  REST-style interface (JSON or XML) covering item management, order management,
  shipping-label services, RMA/returns, datafeed batch processing, reports,
  seller management, and Shipped By Newegg (SBN) fulfillment. First-party .NET
  and Java SDKs, a developer portal, service-status page, and dated release
  notes support the integration.
