generated: '2026-07-20'
method: searched
source: https://developer.newegg.com/
notes: >-
  First-party Newegg Marketplace SDKs for .NET (C#) and Java, published by the
  Newegg org on GitHub and to the public NuGet and Maven Central registries.
  Both wrap the Newegg Marketplace API request/response object models and add
  retry, logging, and async support.
packages:
