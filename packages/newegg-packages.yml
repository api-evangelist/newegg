    registry: nuget
    name: Newegg.Marketplace.SDK
    url: https://www.nuget.org/packages/Newegg.Marketplace.SDK
    repo: https://github.com/Newegg/newegg-marketplace-sdk-dotnet
    install: dotnet add package Newegg.Marketplace.SDK
    latest_version: 1.0.10
    target: .NET Standard 2.0 (.NET Framework 4.6+, .NET Core 2.1+)
    official: true
  - language: java
    registry: maven-central
    name: com.newegg.marketplace:sdk-all
    url: https://central.sonatype.com/artifact/com.newegg.marketplace/sdk-all
    repo: https://github.com/Newegg/newegg-marketplace-sdk-java
    install: |
      <dependency>
        <groupId>com.newegg.marketplace</groupId>
        <artifactId>sdk-all</artifactId>
        <version>2.0.0</version>
      </dependency>
    latest_version: 2.0.0
    target: Java 1.8+
    official: true
